<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="ASL sign for RAIN">
  <rect width="120" height="120" rx="12" fill="#4a9ede" opacity="0.15"/>
  <rect width="120" height="120" rx="12" fill="none" stroke="#4a9ede" stroke-width="2"/>
  <!-- Stylised hand outline -->
  <g fill="#4a9ede" opacity="0.85">
    <!-- Palm -->
    <rect x="42" y="62" width="36" height="30" rx="6"/>
    <!-- Fingers -->
    <rect x="42" y="30" width="8" height="36" rx="4"/>
    <rect x="53" y="24" width="8" height="42" rx="4"/>
    <rect x="64" y="26" width="8" height="40" rx="4"/>
    <rect x="75" y="32" width="8" height="34" rx="4"/>
    <!-- Thumb -->
    <rect x="28" y="52" width="16" height="8" rx="4" transform="rotate(-30 28 52)"/>
  </g>
  <text x="60" y="108" font-family="sans-serif" font-size="11" font-weight="bold"
        fill="#4a9ede" text-anchor="middle">RAIN</text>
</svg>